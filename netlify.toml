[build]
  publish = "."
  command = "echo 'No build command needed for static site'"

# Remove the [[redirects]] section completely - it's breaking your admin panel
# Add this instead to ensure admin files are properly served:
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache, max-age=0"
