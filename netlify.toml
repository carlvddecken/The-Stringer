[build]
  publish = "."
  command = "echo 'No build command needed for static site'"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/*"  # Applies to all paths (or use "/admin/*" if only for admin)
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = """
      default-src 'self' https://identity.netlify.com https://unpkg.com;
      script-src 'self' https://identity.netlify.com https://unpkg.com 'unsafe-inline' 'unsafe-eval';
      style-src 'self' https://identity.netlify.com 'unsafe-inline';
      img-src 'self' https://*.netlify.app data:;
      connect-src 'self' https://identity.netlify.com https://unpkg.com;
      frame-src 'self' https://identity.netlify.com;
    """
