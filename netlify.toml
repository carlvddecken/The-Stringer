build]
  publish = "."
  command = "echo 'No build command needed for static site'"

# Disable problematic post-processing
[context.production.environment]
  NETLIFY_POST_PROCESSING = "false"

# Ensure admin files are served correctly
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    NETLIFY_POST_PROCESSING = "false"
