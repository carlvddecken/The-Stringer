backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"  # Better to use 'static/' for most frameworks
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "Homepage Content"
    files:
      - label: "Services & Products"
        name: "services"
        file: "content/home.md"  # Must exist in your repo!
        fields:
          - { name: "services", label: "Services", widget: "list" }
          - { name: "products", label: "Products", widget: "list" }
          - { name: "gallery", label: "Gallery Image URLs", widget: "list" }
          - { name: "contact", label: "Contact Info", widget: "markdown" }
