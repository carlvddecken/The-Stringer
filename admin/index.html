<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Content Manager</title>
  <!-- Required CMS scripts -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/netlify-cms@^3.0.0/dist/netlify-cms.js"></script>
</head>
<body>
  <!-- Loading indicator (optional) -->
  <div style="padding: 2rem; text-align: center;">
    Loading CMS...
  </div>
  
  <!-- Debug script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded - CMS should appear soon');
      if (window.CMS) {
        console.log('Netlify CMS loaded successfully!');
      } else {
        console.error('Netlify CMS failed to load!');
      }
    });
  </script>
</body>
</html>
