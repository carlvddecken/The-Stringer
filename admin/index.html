<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CMS Loading...</title>
  <script>
  // DEBUGGING - Will show us exactly where it fails
  console.log("Starting CMS load...");
  document.addEventListener('DOMContentLoaded', function() {
    console.log("DOM loaded - injecting scripts");
    
    // 1. Load Identity
    const identityScript = document.createElement('script');
    identityScript.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
    document.head.appendChild(identityScript);
    
    // 2. Load CMS after Identity is ready
    identityScript.onload = function() {
      console.log("Identity loaded - loading CMS");
      const cmsScript = document.createElement('script');
      cmsScript.src = 'https://unpkg.com/netlify-cms@^3.0.0/dist/netlify-cms.js';
      document.head.appendChild(cmsScript);
      
      cmsScript.onload = function() {
        console.log("CMS loaded successfully!");
        if(window.CMS) {
          CMS.init();
        }
      };
    };
  });
  </script>
</head>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.CMS) {
      console.log('Initializing CMS...');
      CMS.init();
      CMS.registerPreviewStyle('/admin/cms.css'); // Optional for styling
    } else {
      console.error('CMS object not found!');
    }
  });
</script>
<body>
  <div style="padding: 2rem; text-align: center;">
    Loading CMS... Check browser console (F12) for details.
  </div>
</body>
</html>
