<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Content Manager</title>
  <!-- Self-hosted CMS files -->
  <script src="/admin/netlify-cms.js"></script>
  <!-- Optional: Add styles if downloaded -->
  <link rel="stylesheet" href="/admin/netlify-cms.css">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    #status {
      max-width: 400px;
      margin: 3rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
    }
    .error { color: #d33; }
  </style>
</head>
<body>
  <div id="status">
    <h2>Loading Content Manager</h2>
    <p id="message">Initializing...</p>
  </div>

  <script>
  // Verify CMS loaded
  function checkCMS() {
    if (window.CMS) {
      document.getElementById('message').textContent = 'CMS Ready!';
      CMS.init();
      
      // Optional: Add preview styles
      if (typeof CMS.registerPreviewStyle === 'function') {
        CMS.registerPreviewStyle('/admin/cms.css');
      }
    } else {
      document.getElementById('message').className = 'error';
      document.getElementById('message').textContent = 
        'CMS failed to load. Files might be missing.';
    }
  }

  // Check every 500ms until loaded
  const interval = setInterval(() => {
    if (window.CMS) {
      clearInterval(interval);
      checkCMS();
    }
  }, 500);

  // Timeout after 5 seconds
  setTimeout(() => {
    if (!window.CMS) {
      clearInterval(interval);
      document.getElementById('message').className = 'error';
      document.getElementById('message').textContent = 
        'CMS failed to load. Please check your admin folder files.';
    }
  }, 5000);
  </script>
</body>
</html>
